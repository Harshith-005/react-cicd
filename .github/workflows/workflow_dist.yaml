name: workflow_dist

on:
    push:
       branches:
         - main
         - features
       paths-ignore:
         - '.github/workflows/**'
         - README.md
    workflow_dispatch:
jobs:
    greet:
        runs-on: ubuntu-latest
        steps:
            - name: "greet"
              run: echo "hello World!"
    test:
        runs-on: ubuntu-latest
        steps:
            - name: "clone repo"
              uses: actions/checkout@v4

            - name: "install node 20"
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: Cache Dependencies
              uses: actions/cache@v4
              with:
               path: ~/.npm
               key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

            - name: "print node version"
              run: node -v
            - name: "install dependencies"
              run: npm ci
            - name: "run test"
              run: npm test
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
          - name: "get code"
            uses: actions/checkout@v4
          - name: "install node"
            uses: actions/setup-node@v4
            with:
              node-version: 20
          - name: "cache dependencies"
            uses: actions/cache@v4
            with:
               path: ~/.npm
               key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  
          - name: "install dependencies"
            run: npm ci
          - name: "build"
            run: npm run build
          - name: "upload dist artifact"
            uses: actions/upload-artifact@v4
            with:
              name: dist-file
              path: dist



    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
          - name: download dist artifact
            uses: actions/download-artifact@v4
            with:
              name: dist-file
              path: dist
          - name: "deploy"
            run: echo "deploued successfully"

        
            
              

        

